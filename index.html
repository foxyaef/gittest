<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>예배 악보</title><style>body{margin:0;background:#090909;color:#fff;font-family:-apple-system,sans-serif}header{position:sticky;top:0;background:#090909;padding:18px}h1{margin:0 0 12px}input{width:100%;box-sizing:border-box;font-size:20px;padding:13px;background:#191919;color:#fff;border:1px solid #444;border-radius:13px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:16px}.card{min-height:70px;background:#171717;color:#fff;border:1px solid #333;border-radius:14px;font-size:18px;padding:12px}#viewer{display:none;position:fixed;inset:0;background:#000;z-index:10;overflow:auto}#score{width:100%;display:block}.bar{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;z-index:11}.bar button{font-size:17px;padding:10px;background:#222;color:white;border:0;border-radius:10px}</style></head><body><header><h1>예배 악보 25곡</h1><input id="q" placeholder="곡 제목 검색…"></header><main class="grid" id="grid"></main><section id="viewer"><img id="score"><div class="bar"><button onclick="closeScore()">☰ 목록</button><button onclick="move(-1)">‹ 이전</button><button onclick="move(1)">다음 ›</button></div></section><script>const scores=[['영접송 (내 맘을 엽니다)','5789'],['엘 샤다이','5790'],['주께 와 엎드려','5791'],['성령의 불 주소서','5792'],['예수 우리 왕이여','5793'],['주는 존귀하신 분','5794'],['사랑하는 나의 아버지','5795'],['나의 힘이 되신 여호와여','5796'],['나의 안에 거하라','5797'],['비밀','5798'],['말씀 앞에서','5799'],['예수 우리 왕이여 (A키)','5801'],['예수 예수 예수','5802'],['주의 성소로','5804'],['주님 내가 여기 있사오니','5805'],['이 땅 위에 오신','5806'],['주님은 내 호흡','5807'],['Trust in God','5808'],['하늘의 나는 새도','5809'],['사랑의 노래 드리네','5810'],['주님만이 왕이십니다','5951'],['문들아 머리 들어라','5955'],['보혈을 지나','5956'],['지존하신 주님 이름 앞에','5957'],['주 영광 나타내소서','5958']];let cur=0;const grid=document.getElementById('grid');scores.forEach((s,i)=>{let b=document.createElement('button');b.className='card';b.textContent=s[0];b.dataset.t=s[0];b.onclick=()=>openScore(i);grid.appendChild(b)});function openScore(i){cur=i;document.getElementById('score').src='images/'+scores[i][1]+'.png';document.getElementById('viewer').style.display='block'}function closeScore(){document.getElementById('viewer').style.display='none'}function move(d){cur=(cur+d+scores.length)%scores.length;openScore(cur)}document.getElementById('q').oninput=e=>{let q=e.target.value.replace(/\s/g,'').toLowerCase();document.querySelectorAll('.card').forEach(b=>b.style.display=b.dataset.t.replace(/\s/g,'').toLowerCase().includes(q)?'block':'none')}</script></body></html>
