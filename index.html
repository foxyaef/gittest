<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>예배 악보</title><style>*{box-sizing:border-box}html,body{margin:0;background:#080808;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}header{position:sticky;top:0;z-index:5;background:#080808ee;padding:18px;border-bottom:1px solid #333}h1{margin:0 0 12px}input{width:100%;padding:14px;border-radius:12px;border:1px solid #444;background:#181818;color:#fff;font-size:20px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:16px}.card{min-height:72px;border:1px solid #333;border-radius:15px;background:#171717;color:#fff;text-align:left;padding:14px;display:flex;gap:12px;align-items:center;font-size:18px}.card b{color:#999}#viewer{display:none;position:fixed;inset:0;background:#000;z-index:20;overflow:hidden}.stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}#score{display:block;width:auto!important;height:auto!important;max-width:100vw!important;max-height:100dvh!important;object-fit:contain!important}.back{position:absolute;top:calc(8px + env(safe-area-inset-top));left:8px;z-index:22;background:#111b;color:#fff;border:1px solid #444;border-radius:12px;padding:9px 11px;font-size:15px}@media(min-width:800px){.grid{grid-template-columns:repeat(3,1fr);max-width:1100px;margin:auto}}</style></head><body><header><h1>예배 악보 <small>25곡</small></h1><input id="q" placeholder="곡 제목 검색…"></header><main class="grid" id="grid"></main><section id="viewer"><div class="stage"><img id="score"></div><button class="back" onclick="closeScore()">☰ 목록</button></section><script>const scores=[['영접송 (내 맘을 엽니다)','01.png'],['엘 샤다이','02.png'],['주께 와 엎드려','03.png'],['성령의 불 주소서','04.png'],['예수 우리 왕이여','05.png'],['주는 존귀하신 분','06.png'],['사랑하는 나의 아버지','07.png'],['나의 힘이 되신 여호와여','08.png'],['나의 안에 거하라','09.png'],['비밀','10.png'],['말씀 앞에서','11.png'],['예수 우리 왕이여 (A키)','12.png'],['예수 예수 예수','13.png'],['주의 성소로','14.png'],['주님 내가 여기 있사오니','15.png'],['이 땅 위에 오신','16.png'],['주님은 내 호흡','17.png'],['Trust in God','18.png'],['하늘의 나는 새도','19.png'],['사랑의 노래 드리네','20.png'],['주님만이 왕이십니다','21.png'],['문들아 머리 들어라','22.png'],['보혈을 지나','23.png'],['지존하신 주님 이름 앞에','24.png'],['주 영광 나타내소서','25.png']];let cur=0;const grid=document.getElementById('grid'),v=document.getElementById('viewer'),im=document.getElementById('score');scores.forEach((s,i)=>{let b=document.createElement('button');b.className='card';b.dataset.title=s[0];b.innerHTML='<b>'+String(i+1).padStart(2,'0')+'</b><span>'+s[0]+'</span>';b.onclick=()=>openScore(i);grid.appendChild(b)});function openScore(i){cur=i;v.style.display='block';document.body.style.overflow='hidden';im.src=scores[cur][1]+'?v=5'}function closeScore(){v.style.display='none';document.body.style.overflow=''}document.getElementById('q').oninput=e=>{let q=e.target.value.replace(/\s/g,'').toLowerCase();document.querySelectorAll('.card').forEach(x=>x.style.display=x.dataset.title.replace(/\s/g,'').toLowerCase().includes(q)?'flex':'none')};</script></body></html>
